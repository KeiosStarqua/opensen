name: opensen
description: "OpenSen - offline situational speaking practice built on sentence chunks."
publish_to: 'none'

# Semantic version + build number. Bump the build number for every store upload.
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State management at the composition root (no code generation).
  flutter_riverpod: ^3.0.0
  # Declarative routing with a persistent bottom-navigation shell.
  go_router: ^16.0.0
  # Local SQLite persistence. `sqflite_common` is imported directly by the
  # data layer so repositories stay free of Flutter plugin imports; `sqflite`
  # supplies the mobile database factory, `sqflite_common_ffi` the desktop one.
  sqflite: ^2.4.1
  sqflite_common: ^2.5.4
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.5
  # Offline system text-to-speech for "listen and repeat".
  flutter_tts: ^4.2.0
  # Hands the Anki export file to other apps.
  share_plus: ^11.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/seed/content.json
