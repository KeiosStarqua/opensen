services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opensen
      POSTGRES_PASSWORD: opensen
      POSTGRES_DB: opensen_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opensen -d opensen_test']
      interval: 2s
      timeout: 5s
      retries: 15
