name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Also build the iOS app (no code signing)"
        type: boolean
        default: false

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # sqflite_common_ffi loads the system SQLite library in tests.
      - name: Install SQLite for repository tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting (advisory)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      # Errors and warnings fail the build; lint infos are reported but not
      # fatal so style nits never block a green pipeline. Run
      # `dart fix --apply` locally to clear them.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Debug-signed release build: installable on any device for testing.
      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opensen-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  build-ios:
    name: Build iOS (no codesign)
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    needs: analyze-and-test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign
